// Example: /etc/apt/apt.conf.d/50unattended-upgrades
// Configured for Security Updates Only + mail2hook + Reboot options

// 1. Allowed Origins: ONLY install security updates
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    // "${distro_id}ESMApps:${distro_codename}-apps-security";
    // "${distro_id}ESM:${distro_codename}-infra-security";
};

// 2. Package Blacklist: Packages that should NEVER be automatically updated (optional)
Unattended-Upgrade::Package-Blacklist {
    // "nginx";
    // "postgresql";
};

// 3. Mail2Hook Integration
// Deliver upgrade reports to mail2hook (via /usr/sbin/sendmail)
Unattended-Upgrade::Mail "root";

// "on-change" sends a Discord notification when packages change or errors occur (recommended)
// "always" sends a Discord notification on every run, even with zero changes
// "only-on-error" sends a Discord notification only if an upgrade fails
Unattended-Upgrade::MailReport "on-change";

// Clean sender name for email headers
Unattended-Upgrade::Sender "unattended-upgrades";

// 4. Conservative cleanup settings
// Leave disabled so automatic runs do not remove kernels or dependencies unexpectedly
Unattended-Upgrade::Remove-Unused-Dependencies "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "false";

// 5. Reboot Settings
// If false, the server will not reboot automatically.
// Mail2hook will display: "Reboot: Required" in Discord when a reboot is needed.
Unattended-Upgrade::Automatic-Reboot "false";

// If you want the server to reboot automatically when needed, change above to "true"
// and optionally specify a maintenance window (e.g. 03:00 AM):
// Unattended-Upgrade::Automatic-Reboot-Time "03:00";
// Unattended-Upgrade::Automatic-Reboot-WithUsers "false";
